services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: demo_admin
      POSTGRES_PASSWORD: demo_admin_password
      POSTGRES_DB: audit_db
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo_admin -d audit_db"]
      interval: 5s
      timeout: 3s
      retries: 10
  mcp-auditor:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://audit_reader:audit_readonly@postgres:5432/audit_db
    depends_on:
      postgres:
        condition: service_healthy
